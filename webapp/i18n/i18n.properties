# Our People
peopleTitle=Our People
peopleSubtitle=The directors you brief are the people who estimate, build and deliver the work.
person1Name=Igor Muntoreanu
person1Role=Founder and Principal Developer
person1Bio=Igor started MindTek so clients can work directly with the person writing the code. He has spent 16 years as an SAP technical consultant across ABAP, ABAP OO, Fiori and OpenUI5, RAP, CDS, OData, Workflow and S/4HANA. He has led Fiori and OData work on S/4HANA programmes, including EWM at John Deere, plant-maintenance apps at Voith, and UI5 cockpits at Mercedes-Benz, with earlier CRM and ECC delivery at Deutsche Telekom, Unilever and others.
person1Focus=SAP-certified (ABAP, HANA). MBA in SAP. Works in English, German and Portuguese.
person2Name=Neska Braga
person2Role=Director and Principal Project Manager
person2Bio=Neska directs delivery at MindTek: scope, stakeholders, risk and go-live, without a separate account-management layer. She has run complex IT programmes across cloud migration, data centre and infrastructure, finance and procurement change, and global managed services. Her background includes public sector, financial services, pharma and telecoms, with programmes at Mastercard, Vodafone, Santander, Takeda, Canada Life, ERM, Cloudreach, Grünenthal and West Sussex County Council.
person2Focus=PRINCE2 Practitioner, Scrum Master and ITIL. Works in English, Portuguese and Spanish.

