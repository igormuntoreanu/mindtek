	<script>
		/* Real paths such as /about/ have no hash yet. Point the UI5 router at the matching route before it starts. */
		(function () {
			var mRoutes = {
				"/": "",
				"/index.html": "",
				"/about": "about",
				"/about/": "about",
				"/people": "people",
				"/people/": "people",
				"/work": "work",
				"/work/": "work",
				"/portfolio": "work",
				"/portfolio/": "work",
				"/contact": "contact",
				"/contact/": "contact"
			};
			var sPath = window.location.pathname;
			if (!Object.prototype.hasOwnProperty.call(mRoutes, sPath)) {
				return;
			}
			if (window.location.hash && window.location.hash !== "#") {
				return;
			}
			var sRoute = mRoutes[sPath];
			window.history.replaceState(null, "", sPath + (sRoute ? "#/" + sRoute : "#/"));
		}());
	</script>
