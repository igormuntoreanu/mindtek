specVersion: "3.1"
metadata:
  name: mindtek
type: application
framework:
  name: OpenUI5
  version: "1.151.0"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.ui.layout
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: serve-spa
      beforeMiddleware: compression
    - name: ui5-middleware-livereload
      afterMiddleware: compression
      configuration:
        extraExts: "xml,json,properties,jpg,png,jpeg"
        watchPath: "webapp"

---
specVersion: "3.0"
kind: extension
type: server-middleware
metadata:
  name: serve-spa
middleware:
  path: middleware/serveSpa.js
