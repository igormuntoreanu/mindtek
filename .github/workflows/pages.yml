name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: igormuntoreanu/mindtek-journalentry-monitor
          path: vendor/journalentry-monitor
      - uses: actions/checkout@v4
        with:
          repository: igormuntoreanu/mindtek-journalentry-monitor-alp
          path: vendor/journalentry-monitor-alp
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Add showcase apps and custom domain
        run: |
          mkdir -p dist/journalentry-monitor dist/journalentry-monitor-alp
          cp -a vendor/journalentry-monitor/webapp/. dist/journalentry-monitor/
          cp -a vendor/journalentry-monitor-alp/webapp/. dist/journalentry-monitor-alp/
          echo "mindtek-ltd.com" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
